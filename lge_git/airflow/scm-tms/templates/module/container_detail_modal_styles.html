<style>
/* ══════════════════════════════════════════════════════════════════════════════
   Container Detail Modal Styles
   ══════════════════════════════════════════════════════════════════════════════ */

#containerDetailBackdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(3px);
    z-index: 9998;
    overflow-y: auto;
    padding: 2rem 0;
}

.container-detail-modal {
    position: relative;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    max-width: 1200px;
    width: 95%;
    margin: 0 auto;
    animation: modalSlideIn 0.25s ease-out;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 4rem);
    overflow: hidden;
}

@keyframes modalSlideIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.container-detail-header {
    background: linear-gradient(135deg, oklch(0.35 0.15 293) 0%, oklch(0.25 0.12 293) 100%);
    color: #fff;
    padding: 1.5rem 2rem;
    border-radius: 12px 12px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.container-detail-title-group {
    flex: 1;
}

.container-detail-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 0.35rem 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.container-detail-subtitle {
    font-size: 0.9rem;
    opacity: 0.85;
    margin: 0;
}

.container-detail-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.75rem;
}

.container-detail-close {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    border-radius: 6px;
    color: #fff;
    width: 32px;
    height: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: background 0.2s;
    flex-shrink: 0;
}

.container-detail-close:hover {
    background: rgba(255, 255, 255, 0.25);
}

.container-detail-body {
    padding: 2rem;
    overflow-y: auto;
    flex: 1 1 0;
}

.container-info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.25rem;
    margin-bottom: 2rem;
}

.container-info-card {
    background: oklch(0.98 0.005 293);
    border: 1px solid oklch(0.90 0.01 293);
    border-radius: 8px;
    padding: 1.25rem;
}

.container-info-card-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: oklch(0.45 0.15 293);
    margin: 0 0 1rem 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.container-info-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.5rem 0;
    border-bottom: 1px solid oklch(0.94 0.005 293);
}

.container-info-row:last-child {
    border-bottom: none;
}

.container-info-label {
    font-size: 0.85rem;
    color: var(--muted-foreground);
    font-weight: 500;
}

.container-info-value {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--foreground);
    text-align: right;
}

.container-info-value.mono {
    font-family: 'Courier New', monospace;
}

.container-info-value.empty {
    color: var(--muted-foreground);
    font-style: italic;
    font-weight: 400;
}

/* Container Timeline */
.container-timeline {
    background: oklch(0.98 0.005 293);
    border: 1px solid oklch(0.90 0.01 293);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 2rem;
}

.container-timeline-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: oklch(0.45 0.15 293);
    margin: 0 0 1.5rem 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.container-timeline-steps {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
}

.container-timeline-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
}

.container-timeline-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    flex: 1;
    min-width: 80px;
}

.container-timeline-step:not(:last-child)::after {
    content: '';
    position: absolute;
    top: 20px;
    left: calc(50% + 25px);
    width: calc(100% - 50px);
    height: 2px;
    background: oklch(0.90 0.01 293);
    z-index: -1;
}

.container-timeline-step.done:not(:last-child)::after {
    background: oklch(0.55 0.18 150);
}

.container-timeline-step.current:not(:last-child)::after {
    background: linear-gradient(to right, oklch(0.66 0.18 60) 0%, oklch(0.90 0.01 293) 100%);
}

.container-step-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    margin-bottom: 0.5rem;
    transition: all 0.2s;
}

.container-timeline-step.done .container-step-icon {
    background: oklch(0.55 0.18 150);
    color: #fff;
}

.container-timeline-step.current .container-step-icon {
    background: oklch(0.66 0.18 60);
    color: #fff;
    animation: pulse 2s infinite;
}

.container-timeline-step.pending .container-step-icon {
    background: oklch(0.92 0.005 293);
    color: var(--muted-foreground);
}

@keyframes pulse {
    0%, 100% {
        box-shadow: 0 0 0 0 rgba(255, 165, 0, 0.4);
    }
    50% {
        box-shadow: 0 0 0 8px rgba(255, 165, 0, 0);
    }
}

.container-step-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--foreground);
    margin-bottom: 0.25rem;
    white-space: nowrap;
}

.container-step-date {
    font-size: 0.65rem;
    font-family: 'Courier New', monospace;
    color: var(--muted-foreground);
    white-space: nowrap;
}

.container-step-date.filled {
    color: var(--foreground);
    font-weight: 500;
}

/* Status Badge in modal */
.container-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
}

.container-status-badge.on-factory {
    background: oklch(0.95 0.02 60);
    color: oklch(0.45 0.15 60);
}

.container-status-badge.ship-out {
    background: oklch(0.95 0.02 240);
    color: oklch(0.45 0.15 240);
}

.container-status-badge.intransit {
    background: oklch(0.95 0.02 200);
    color: oklch(0.45 0.15 200);
}

.container-status-badge.arrived {
    background: oklch(0.95 0.02 150);
    color: oklch(0.45 0.15 150);
}

/* Container link in grid */
.container-no-link {
    color: oklch(0.55 0.20 240) !important;
    text-decoration: none !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    transition: all 0.15s !important;
    border-bottom: none !important;
}

.container-no-link:hover {
    color: oklch(0.45 0.25 240) !important;
    text-decoration: underline !important;
}

/* ── Model List Grid ─────────────────────────────────────────── */
.container-model-grid-section {
    margin: 0 0 2rem;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    overflow: hidden;
}

.container-model-grid-section .container-info-card-title {
    padding: 0.75rem 1rem;
    margin: 0;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
}

.container-model-grid-count {
    margin-left: auto;
    font-size: 0.72rem;
    color: #64748b;
    font-weight: 400;
}

.container-model-grid-wrap {
    overflow-x: auto;
    max-height: 320px;
    overflow-y: auto;
}

.container-model-grid {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
    min-width: 700px;
}

.container-model-grid thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #f1f5f9;
    color: oklch(0.55 0.20 240);
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.5rem 0.75rem;
    border-bottom: 2px solid #e2e8f0;
    text-align: left;
    white-space: nowrap;
}

.container-model-grid thead th.num { text-align: right; }

.container-model-grid tbody tr {
    border-bottom: 1px solid #f1f5f9;
    transition: background 0.1s;
}

.container-model-grid tbody tr:hover { background: #f8fafc; }

.container-model-grid tbody tr:last-child { border-bottom: none; }

.container-model-grid tbody td {
    padding: 0.45rem 0.75rem;
    color: #334155;
    white-space: nowrap;
}

.container-model-grid tbody td.num {
    text-align: right;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #0f172a;
}

.container-model-grid tbody td.mono {
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 0.75rem;
    color: #475569;
}

.container-model-grid tbody td.loading-row {
    text-align: center;
    color: #94a3b8;
    padding: 1.5rem;
}

.container-model-grid tbody tr:nth-child(even) { background: #fafbfc; }
.container-model-grid tbody tr:nth-child(even):hover { background: #f1f5f9; }

/* ── Customs + CY Combined Card ─────────────────────────────── */
.container-combined-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 2rem;
}

.container-combined-subhead {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: oklch(0.55 0.15 240);
    margin-bottom: 0.25rem;
    padding-bottom: 0.25rem;
    border-bottom: 1px solid oklch(0.90 0.01 293);
}
</style>
