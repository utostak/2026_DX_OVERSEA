<style>
/* ══════════════════════════════════════════════════════════════════════════════
   Order Detail Modal Styles
══════════════════════════════════════════════════════════════════════════════ */
.order-no-link {
    color: #0066cc !important;
    text-decoration: underline;
    cursor: pointer;
}
.order-no-link:hover { 
    color: #0052a3 !important;
    text-decoration: underline !important; 
}

/* Modal backdrop with scroll */
.iod-modal-backdrop {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 2rem 1rem;
    align-items: flex-start;
}

/* Order Detail Modal should be on top of other modals (Customer Orders Modal uses z-index: 9000) */
#orderDetailBackdrop.iod-modal-backdrop {
    z-index: 9100;
}

.order-detail-modal { 
    max-width: 1080px; 
    margin: 0 auto;
    max-height: none;
}

.iod-modal-header-left { flex: 1; min-width: 0; }

.iod-modal-title .order-no {
    font-family: "JetBrains Mono", monospace;
    color: var(--primary);
    letter-spacing: -0.01em;
}

.iod-modal-title .line-no {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted-foreground);
}

.iod-modal-subtitle .cust-po {
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    color: var(--foreground);
}

.iod-modal-header-badges {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: flex-end;
}

/* Overview Grid */
.overview-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

.ov-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    background: var(--surface);
    overflow: hidden;
}

.ov-card-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0.55rem 0.9rem;
    background: var(--surface-muted);
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted-foreground);
    font-weight: 700;
}

.ov-card-header i {
    color: var(--primary);
    font-size: 12px;
}

.ov-table {
    width: 100%;
    border-collapse: collapse;
}

.ov-table td {
    padding: 8px 12px;
    vertical-align: top;
    border-bottom: 1px solid color-mix(in oklab, var(--border) 55%, transparent);
    font-size: 13px;
}

.ov-table tr:last-child td {
    border-bottom: none;
}

.ov-table td.k {
    width: 130px;
    color: var(--muted-foreground);
    font-weight: 500;
    font-size: 11.5px;
    white-space: nowrap;
}

.ov-table td.v {
    color: var(--foreground);
    font-weight: 500;
}

.ov-table td.v .primary {
    font-size: 14px;
    font-weight: 600;
}

.ov-table td.v .mono {
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
}

.ov-table td.v .sub {
    color: var(--muted-foreground);
    font-size: 11.5px;
    margin-left: 6px;
}

/* RAD comparison inline */
.rad-cmp {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "JetBrains Mono", monospace;
}

.rad-cmp .rad-arrow {
    color: var(--muted-foreground);
    font-size: 10px;
}

.rad-cmp .rad-init {
    color: var(--muted-foreground);
    text-decoration: line-through;
}

.rad-cmp .rad-init.same {
    color: var(--foreground);
    text-decoration: none;
}

.rad-cmp .rad-latest.changed {
    color: oklch(0.55 0.18 75);
    font-weight: 700;
}

.rad-cmp .rad-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 1px 6px;
    border-radius: 3px;
}

.rad-cmp .rad-tag.same {
    background: #e6f5ec;
    color: #1d6f42;
}

.rad-cmp .rad-tag.changed {
    background: #fff4d6;
    color: #8a5a10;
}

.dday-pill {
    display: inline-flex;
    align-items: center;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 700;
    font-family: "JetBrains Mono", monospace;
    margin-left: 6px;
}

.dday-pill.warn {
    background: #fff4d6;
    color: #8a5a10;
}

.dday-pill.danger {
    background: #fef1f4;
    color: #b02245;
}

.dday-pill.ok {
    background: #e6f5ec;
    color: #1d6f42;
}

/* Timeline */
.timeline-block {
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    background: var(--surface);
    overflow: hidden;
}

.timeline-block-header {
    padding: 0.75rem 1rem;
    background: var(--surface-muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
}

.tl-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--foreground);
}

.tl-title i {
    color: var(--primary);
}

.tl-legend {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    color: var(--muted-foreground);
}

.tl-legend .lg-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
}

.tl-legend .lg-dot.done {
    background: oklch(0.55 0.18 150);
}

.tl-legend .lg-dot.current {
    background: oklch(0.55 0.18 150);
    box-shadow: 0 0 0 2px oklch(0.94 0.06 150);
}

.tl-legend .lg-dot.pending {
    background: #d5cec1;
}

.timeline-wrap {
    padding: 2rem 1.25rem 1rem;
    overflow-x: auto;
}

.timeline {
    display: flex;
    align-items: flex-start;
    min-width: 900px;
    padding: 0 4px;
}

.timeline-step {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    min-width: 84px;
}

.timeline-step .step-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    background: #d5cec1;
    box-shadow: 0 0 0 3px #fff, 0 0 0 4px #d5cec1;
    position: relative;
    z-index: 2;
    transition: transform 0.15s;
}

.timeline-step.done .step-icon {
    background: oklch(0.55 0.18 150);
    box-shadow: 0 0 0 3px #fff, 0 0 0 4px oklch(0.55 0.18 150);
}

.timeline-step.current .step-icon {
    background: oklch(0.55 0.18 150);
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px oklch(0.55 0.18 150), 0 4px 12px rgba(34, 197, 94, 0.35);
    transform: scale(1.1);
}

.timeline-step.current::before {
    content: 'CURRENT';
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: oklch(0.45 0.20 150);
    padding: 1px 6px;
    border-radius: 3px;
    background: oklch(0.94 0.06 150);
    white-space: nowrap;
}

.step-label {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--foreground);
    text-align: center;
    line-height: 1.25;
}

.timeline-step:not(.done):not(.current) .step-label {
    color: var(--muted-foreground);
}

.step-date {
    margin-top: 3px;
    font-size: 11px;
    color: var(--muted-foreground);
    font-family: "JetBrains Mono", monospace;
}

.step-days {
    margin-top: 4px;
    font-size: 10px;
    font-weight: 600;
    color: var(--muted-foreground);
    background: var(--surface-muted);
    padding: 1px 6px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-family: "JetBrains Mono", monospace;
}

/* Timeline connectors */
.timeline-step + .timeline-step::before {
    content: '';
    position: absolute;
    top: 21px;
    left: -50%;
    right: 50%;
    height: 3px;
    background: #e6dfd0;
    z-index: 1;
}

.timeline-step.done + .timeline-step::before,
.timeline-step.current + .timeline-step::before {
    background: oklch(0.55 0.18 150);
}

.timeline-step + .timeline-step.pending::before {
    background: repeating-linear-gradient(90deg, #d5cec1 0 6px, transparent 6px 10px);
    height: 2px;
    top: 21.5px;
}

/* Accordion Details */
.details-accordion {
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    background: var(--surface);
    overflow: hidden;
}

.acc-header {
    padding: 0.6rem 0.9rem;
    background: var(--surface-muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted-foreground);
    font-weight: 700;
    user-select: none;
}

.acc-header i.acc-icon {
    color: var(--primary);
    font-size: 12px;
}

.acc-header i.acc-caret {
    margin-left: auto;
    transition: transform 0.15s;
    font-size: 10px;
    opacity: 0.6;
}

.details-accordion.open .acc-caret {
    transform: rotate(180deg);
}

.acc-body {
    display: none;
}

.details-accordion.open .acc-body {
    display: block;
}

/* Date Grid */
.date-grid {
    padding: 0.75rem;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
}

.date-tile {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.date-tile.filled {
    border-color: color-mix(in oklab, oklch(0.55 0.18 150) 30%, var(--border));
    background: color-mix(in oklab, oklch(0.55 0.18 150) 4%, var(--surface));
}

.date-tile .d-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted-foreground);
    font-weight: 600;
}

.date-tile .d-value {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--foreground);
    font-family: "JetBrains Mono", monospace;
}

.date-tile .d-value.empty {
    color: var(--muted-foreground);
    font-weight: 400;
}

/* Flag Grid */
.flag-grid {
    padding: 0.75rem;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.flag-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    font-size: 12px;
}

.flag-item .flag-key {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted-foreground);
    font-weight: 600;
}

.flag-item .flag-val {
    font-weight: 600;
    color: var(--foreground);
}

.flag-item.on-danger {
    background: #fef1f4;
    border-color: #f8d3de;
    color: #b02245;
}

.flag-item.on-warn {
    background: #fff4d6;
    border-color: #f2ddaa;
    color: #8a5a10;
}

.flag-item.on-info {
    background: #e6f2fb;
    border-color: #cfe1f3;
    color: #205b8f;
}

.flag-item.on-ok {
    background: #e6f5ec;
    border-color: #c9e5d4;
    color: #1d6f42;
}

.flag-item.off {
    background: var(--surface-muted);
    color: var(--muted-foreground);
}

.flag-item.off .flag-val {
    color: var(--muted-foreground);
    font-weight: 500;
}

/* Responsive */
@media (max-width: 900px) {
    .overview-grid {
        grid-template-columns: 1fr;
    }
    .date-grid {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
